<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#141619"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="57.25"
        fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- 펼친 책의 페이지 모서리. 스파인에서 바깥으로 처지는 곡선. 22px에서도 살아남도록 두껍게 -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M128 192 C 102 180, 76 177, 50 182" stroke-opacity="0.34" stroke-width="8"/>
    <path d="M128 192 C 154 180, 180 177, 206 182" stroke-opacity="0.34" stroke-width="8"/>
    <path d="M128 64 C 102 52, 76 49, 50 54" stroke-opacity="0.16" stroke-width="6"/>
    <path d="M128 64 C 154 52, 180 49, 206 54" stroke-opacity="0.16" stroke-width="6"/>
  </g>

  <!-- 파형 막대. 스파인에 가까울수록 높고 밝다 -->
  <g fill="#ffffff">
    <rect x="60"  y="98" width="16" height="60"  rx="8" fill-opacity="0.50"/>
    <rect x="88"  y="73" width="16" height="110" rx="8" fill-opacity="0.80"/>
    <rect x="152" y="73" width="16" height="110" rx="8" fill-opacity="0.80"/>
    <rect x="180" y="98" width="16" height="60"  rx="8" fill-opacity="0.50"/>
  </g>

  <!-- 책등 -->
  <rect x="120" y="58" width="16" height="140" rx="8" fill="#ffffff" fill-opacity="0.97"/>
</svg>
