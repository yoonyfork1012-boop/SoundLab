appId: com.soundlib.app
productName: SoundLib
directories:
  output: release
# 자동 업데이트(electron-updater)가 새 버전을 찾아보는 곳. 빌드 시 latest.yml이 함께
# 만들어지고, 이 파일이 릴리스에 같이 올라가 있어야 설치본이 업데이트를 인지한다.
# 저장소가 public이라 토큰 없이 조회된다 — private으로 되돌리면 앱에 토큰을 넣어야 한다.
publish:
  - provider: github
    owner: yoonyfork1012-boop
    repo: SoundLab
    # 기본값(draft)이면 릴리스가 초안으로 올라가고, 초안은 electron-updater가 보지 못한다.
    # 올리는 즉시 업데이트가 배포되길 원하므로 정식 릴리스로 만든다.
    releaseType: release
files:
  - out/**
  - package.json
# better-sqlite3 네이티브 바이너리(N-API 프리빌드)는 asar 안에서 로드할 수 없어 압축 해제
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/**
# better-sqlite3 v13은 런타임 ABI에 독립적인 N-API 프리빌드를 동봉하므로 재빌드가 필요 없다.
# 이걸 끄지 않으면 electron-builder가 node-gyp로 소스 재빌드를 시도해 Visual Studio를 요구하고,
# 빌드 도구가 없는 환경에서는 패키징 자체가 실패한다.
npmRebuild: false
# 단일 PNG(256x256 이상)만 있으면 electron-builder가 빌드 시 ico/icns를 자동 생성
icon: build/icon.png
# BrowserWindow 아이콘/스플래시 로고에서 런타임에 읽을 수 있도록 리소스로 함께 배포
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: SoundLib-${version}-portable.exe
nsis:
  # 클릭 한 번짜리 설치가 아니라 일반적인 설치 마법사(Next/Install/Finish) 형태
  oneClick: false
  # Program Files(시스템 전역 경로)에 설치 — 꺼지면 사용자별 AppData 경로로 바뀜
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SoundLib
  uninstallDisplayName: SoundLib
  artifactName: SoundLib-${version}-setup.exe
